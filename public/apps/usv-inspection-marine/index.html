/* Real point cloud retains a neutral slate stage for contrast, light surrounding UI. */
.model-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 22px;
}
.model-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

.viewer-actions {

  border-color: transparent;
  background: transparent;
}
.tab.active {
  background: #e6efff;
  color: var(--blue);
}
.search {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  background: white;
  border-radius: 6px;
}
.search .icon {
  color: #8aa0b8;
}
.search input {
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 14px;
  width: 210px;
}
.file-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}
.file-thumb {
  height: 160px;
  position: relative;
  background: #e9f0f8;
  display: grid;
  place-items: center;
  color: #90a9c9;
  overflow: hidden;
}
.file-thumb > .icon {
  width: 45px;
  height: 45px;
  stroke-width: 1.2;
}
.file-thumb img {
  height: 100%;
  width: 100%;
  object-fit: cover;
}
.file-type {
  position: absolute;
  bottom: 12px;
  right: 12px;
  padding: 3px 7px;
  background: #fffdf3df;
  border-radius: 3px;
  font-size: 10px;
  color: #637b98;
}
.file-detail {
  padding: 20px;
}
.file-detail h3 {
  font-size: 18px;
  margin-bottom: 10px;
}
.file-detail p {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.9;
}
.file-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}
.file-actions .button {
  flex: 1;
}
dialog {
  border: 1px solid var(--line);
  padding: 0;
  border-radius: 10px;
  width: min(980px, 90vw);
  color: var(--text);
  background: #fff;
  max-height: 90vh;
}
dialog::backdrop {
  background: #142c4b8a;
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
}
#dialogBody {
  padding: 18px;
}
#dialogBody img,
#dialogBody video {
  display: block;
  max-width: 100%;
  max-height: 72vh;
  margin: auto;
}
#dialogBody iframe {
  width: 100%;
  height: 72vh;
  border: 0;
}
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translate(-50%, 12px);
  opacity: 0;
  pointer-events: none;
  z-index: 100;
  background: #1d395c;
  color: #fff;
  border-radius: 6px;
  padding: 11px 20px;
  font-size: 14px;
  transition: 0.18s;
  box-shadow: 0 6px 24px #102b5622;
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

:root {
  color-scheme: dark;
  --bg: #101e27;
  --panel: #142731;
  --raised: #1c3540;
  --line: #304b58;
  --text: #eaf2f5;
  --muted: #91a8b6;
  --blue: #64ddbf;
  --amber: #64ddbf;
  --teal: #64ddbf;
  --red: #ff9c51;
}
body {
  background: var(--bg);
  color: var(--text);
}
button {
  background: var(--panel);
  color: var(--text);
}
button:hover,
.button:hover {
  background: #203b46;
  border-color: #547b88;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
canvas:focus-visible {
  outline-color: #64ddbf;
}
.site-header {
  background: #10202a;
  border-color: var(--line);
  height: 70px;
  padding: 0 26px;
  gap: 26px;
}
.brand {
  font-size: 26px;
}
.brand small {
  font-size: 9px;
  letter-spacing: 1.8px;
}
.brand > svg {
  stroke: var(--blue);
  width: 39px;
  height: 39px;
}
.nav-item {
  color: #d0dce3;
  font-size: 17px;
}
.nav-item.active {
  color: var(--blue);
}
#navigation {
  gap: 35px;
}
.header-actions {
  gap: 18px;
}
.edition {
  color: var(--muted);
  font-size: 12px;
}
.blog-return {
  font-size: 14px;
}
.app {
  margin-left: 86px;
  min-height: calc(100dvh - 70px);
}
.marine-rail {
  position: fixed;
  left: 0;
  top: 70px;
  bottom: 0;
  width: 86px;
  border-right: 1px solid var(--line);
  background: #10212a;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 17px 7px;
  z-index: 5;
}
#railNav {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#railNav .nav-item {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  padding: 17px 3px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 450;
  line-height: 1.3;
}
#railNav .nav-item .icon {
  display: block;
  width: 26px;
  height: 26px;
  stroke-width: 1.6;
}
#railNav .nav-item.active {
  background: #19483f;
  color: #6ee5c8;
}
#railNav .nav-item.active:after {
  display: none;
}
.rail-caption {
  font: 9px monospace;
  letter-spacing: 1px;
  color: #597481;
  text-align: center;
  margin-top: auto;
  padding-top: 20px;
}
main {
  padding: 28px;
}
.panel {
  background: var(--panel);
  border-color: #385666;
  border-radius: 7px;
}
.panel-head {
  border-color: var(--line);
}
.panel-head h2 {
  color: #edf4f7;
}
.panel-head .icon {
  color: var(--blue);
}
.button {
  background: transparent;
  color: var(--text);
  border-color: #3a5968;
}
.button.primary {
  background: #67dfc2;
  border-color: #67dfc2;
  color: #0e302e;
  font-weight: 650;
}
.button.primary:hover {
  background: #88ebd1;
}
.pill.warning {
  color: #64ddbf;
  background: #20483f;
}
.pill.muted {
  color: #a5bcc9;
  background: #223b47;
}
.pill.danger {
  color: #ffae70;
  background: #503729;
}
.button.report-entry {
  border-color: #62cbb3;
  color: #77e0c8;
}
.page-heading p,
.tip,
.meta {
  color: var(--muted);
}
.eyebrow {
  color: #67c8b3;
}
.page-heading h1 {
  font-weight: 550;
}
.archive-note {
  color: #8fa6b5;
}
.number {
  color: #a4bcca;
  background: #28414c;
}
.number.active,
.active .number {
  color: #15362e;
  background: var(--blue);
}
.defect-select.active {
  background: #1d423d;
  border-color: #35675b;
}
.data-pair {
  border-color: #2b424f;
}
.defect-info p {
  color: #9db3c0;
}
.model-notice {
  color: #8ca4b2;
}
.model-toolbar {
  background: #162b37;
}
.interaction-tabs .active {
  background: #215046;
  border-color: #3c806e;
  color: #77e3c8;
}
.cloud-stage {
  background: radial-gradient(ellipse at center, #2a414e, #0c1c26);
}
.reconstruction-tabs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

body[data-page="login"] .marine-rail {
  display: none;
}
body[data-page="login"] .app {
  margin-left: 0;
}
/* The B reference: map left, video and findings right, one telemetry dock. */
body[data-page="monitor"] .app {
  margin-left: 86px;
  flex: 1;
  min-height: 0;
}
body[data-page="monitor"] main {
  padding: 0 16px 10px;
  gap: 14px;
  max-width: none;
}
.marine-toolbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 17px 6px;
  border-bottom: 1px solid #345461;
  flex-shrink: 0;
}
.task-picker {
  display: flex;
  align-items: center;
  gap: 17px;
  white-space: nowrap;
  font-size: 16px;
}
.task-picker > span {
  color: #d3e0e7;
}
.task-picker select {
  max-width: 340px;
  min-width: 265px;
  background: #1a303c;
  border: 1px solid #678391;
  border-radius: 6px;
  padding: 9px 34px 9px 13px;
  color: #e5eef4;
  font-size: 15px;
  font-weight: 550;
}
.demo-switch {
  color: #79d6bf;
  font-size: 13px;
  gap: 8px;
}
.demo-switch input {
  accent-color: #65d9b9;
}
.mode-switch {
  background: #142934;
  border: 1px solid #54717f;
  padding: 2px;
  border-radius: 6px;
  gap: 2px;
}
.mode-switch button {
  font-size: 15px;
  color: #d8e6ed;
  padding: 6px 14px;
  background: transparent;
}
.mode-switch button[aria-pressed="true"] {
  background: #6edfc3;
  color: #13352d;
  font-weight: 650;
  box-shadow: none;
}
.marine-toolbar #connectionState {
  display: none;
}
.marine-toolbar .button {
  white-space: nowrap;
  font-size: 12px;
}
.marine-workspace {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1.65fr) minmax(0, 1fr);
  gap: 12px;
}
.marine-workspace .route-panel {
  grid-row: 1/3;
  grid-column: 1;
}
.marine-workspace .camera-panel {
  grid-column: 2;
  grid-row: 1;
}
.marine-workspace .events-panel {
  grid-column: 2;
  grid-row: 2;
  min-height: 0;
}
.route-panel .panel-head {
  padding: 13px 16px;
}
.route-panel .panel-head h2 {
  font-size: 18px;
}
.route-host {
  background-color: #1d3541;
  background-image:
    linear-gradient(#54718017 1px, transparent 1px),
    linear-gradient(90deg, #54718017 1px, transparent 1px);
  background-size: 52px 52px;
}
.integration-empty h3 {
  color: #c4d7e0;
  font-size: 21px;
}
.integration-empty p {
  color: #829eaf;
  font-size: 14px;
}
.integration-empty .pill {
  background: #29434f;
  color: #9db8c7;
  border: 1px solid #405f6d;
}
.empty-symbol {
  font-size: 66px;
  color: #527a8d;
}
.map-north {
  position: absolute;
  bottom: 24px;
  left: 25px;
  color: #abc3d0;
  text-align: center;
  font: 14px/1.8 monospace;
}
.route-readout {
  background: #162d38;
  border-color: #38525f;
  color: #91adbc;
  font-size: 11px;
  padding: 12px 15px;
}
.route-readout b {
  color: #d0e1ea;
}
.camera-panel .panel-head {
  padding: 9px 15px;
}
.camera-panel .panel-head h2 {
  font-size: 17px;
  font-weight: 500;
  white-space: nowrap;
}
.camera-actions {
  gap: 5px;
}
.camera-actions .button {
  color: #adc7d6;
  border-color: transparent;
  font-size: 12px;
  padding: 5px 7px;
  min-height: 28px;
}
.camera-actions b {
  font: 15px monospace;
  font-weight: 400;
  color: #dceaf1;
  margin: 0 7px;
  align-self: center;
}
.camera-view {
  background: #081922;
}
.feed-tag {
  background: #0e2737b8;
  font-size: 10px;
  color: #b8d5e0;
  top: 10px;
  left: 10px;
}
.camera-offline {
  background: #102630;
  color: #a4becb;
}
.events-panel .panel-head {
  padding: 13px 20px;
  border-bottom: 0;
}
.events-panel .panel-head h2 {
  font-size: 23px;
  font-weight: 550;
}
.events-panel .meta {
  font-size: 11px;
  color: #7494a5;
}
.event-list {
  padding: 0 20px 10px;
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: auto;
  min-height: 0;
}
.event-item {
  border: 0;
  border-top: 1px solid #3b5663;
  border-radius: 0;
  background: transparent;
  padding: 10px 3px;
  gap: 15px;
  min-height: 0;
  flex: 1;
  line-height: 1.3;
}
.event-item:last-child {
  border-bottom: 1px solid #3b5663;
}
.event-item:hover,
.event-item.active {
  background: #1d3e43;
}
.event-name {
  display: block;
  min-width: 0;
}
.event-name strong {
  font-size: 17px;
  line-height: 1.3;
  font-weight: 450;
  display: block;
}
.event-name small {
  display: none;
}
.event-item time {
  font-size: 17px;
  color: #cedee7;
}
.event-symbol {
  color: #79a6b1;
  width: 19px;
  flex-shrink: 0;
  text-align: center;
  font-size: 20px;
}
.priority-event .event-symbol,
.priority-event .event-name strong,
.priority-event time {
  color: #ffa05e;
}
.event-arrow {
  color: #c4d8e1;
  font-size: 25px;
  font-weight: 300;
  margin-left: 10px;
}
.marine-telemetry {
  display: flex;
  align-items: center;
  gap: 15px;
  border-top: 1px solid #3d5b68;
  background: #122732;
  padding: 22px 6px 14px;
  flex-shrink: 0;
}
.metric-grid {
  flex: 1;
  min-width: 0;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  padding: 0;
}
.metric {
  padding: 0 14px;
  border-color: #49626e;
}
.metric > span {
  font-size: 13px;
  color: #b3c7d3;
  margin-bottom: 9px;
  line-height: 1.2;
}
.metric strong {
  font-size: 25px;
  font-weight: 550;
  line-height: 1.2;
  letter-spacing: -0.6px;
  color: #f1f6f8;
}
.metric-alarm {
  background: transparent;
}
.metric-alarm span,
.metric-alarm strong {
  color: #ffab6d;
}
.marine-task-status {
  padding-left: 15px;
  border-left: 1px solid #49626e;
  min-width: 140px;
}
.marine-task-status > span {
  font-size: 13px;
  color: #b3c7d3;
}
.marine-task-status strong {
  display: block;
  font-size: 19px;
  font-weight: 500;
  color: #6edfc1;
  margin-top: 8px;
  white-space: nowrap;
}
.marine-telemetry .report-entry {
  padding: 9px 12px;
  font-size: 14px;
  min-height: 38px;
}
.monitor-status {
  font-size: 9px;
  color: #638394;
  gap: 12px;
}
.monitor-status #sourceBadge {
  margin-left: auto;

  display: none;

/* Qingdao demonstration route. Only a configured mapUrl is the host-controller page. */
window.createQingdaoMap = function (element, task, enabled) {
  if (!element || !window.L) return null;
  const route = task.route;
  const map = L.map(element, {
    scrollWheelZoom: false,
    minZoom: 10,
    maxZoom: 17,
    zoomControl: false,
  }).setView([36.06, 120.391], 13);
  L.control
    .zoom({ position: "topright", zoomInTitle: "放大", zoomOutTitle: "缩小" })
    .addTo(map);
  const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
  }).addTo(map);
  const hint = document.querySelector("#mapLoading");
  let loaded = false;
  tiles.on("tileload", () => {
    loaded = true;
    if (hint) hint.hidden = true;
  });
  tiles.on("tileerror", () => {
    if (!loaded && hint) {
      hint.hidden = false;
      hint.textContent = "底图加载较慢，请稍候";
    }
  });
  L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);
  const path = L.polyline(route, {
    color: "#347d87",
    weight: 4,
    dashArray: "7 8",
  });
  const completed = L.polyline([route[0]], { color: "#08d5d1", weight: 5 });
  const boat = L.marker(route[0], {
    icon: L.divIcon({
      className: "vessel-map-marker",
      html: "<span>▲</span>",
      iconSize: [32, 32],
      iconAnchor: [16, 16],
    }),
  });
  if (enabled) {
    path.addTo(map);
    completed.addTo(map);
    boat.addTo(map);
  }
  const observer = new ResizeObserver(() => map.invalidateSize());
  observer.observe(element);
  return {
    setTime(fraction) {
      const progress = Math.max(0, Math.min(1, fraction)) * (route.length - 1);
      const i = Math.min(route.length - 2, Math.floor(progress)),
        t = progress - i;
      const point = route[i].map((v, k) => v + (route[i + 1][k] - v) * t);
      if (enabled) {
        boat.setLatLng(point);
        completed.setLatLngs([...route.slice(0, i + 1), point]);
      }
      return point;
    },
    fit() {
      map.fitBounds(L.latLngBounds(route).pad(0.7), { maxZoom: 14 });
    },
    dispose() {
      observer.disconnect();
      map.remove();
    },
  };
};

    const header = new TextDecoder().decode(
      bytes.subarray(0, Math.min(bytes.length, 65536)),

      int8: [1, "getInt8"],
      uchar: [1, "getUint8"],
      uint8: [1, "getUint8"],
      short: [2, "getInt16"],
      int16: [2, "getInt16"],
      ushort: [2, "getUint16"],
      uint16: [2, "getUint16"],
      int: [4, "getInt32"],
      int32: [4, "getInt32"],
      uint: [4, "getUint32"],
      uint32: [4, "getUint32"],
      float: [4, "getFloat32"],

      xyz.forEach((v, k) => axes[k].push(v));

      );

    const bounds = axes.map((a) => {
      a.sort((x, y) => x - y);
      return [
        a[Math.floor(a.length * 0.01)],
        a[Math.min(a.length - 1, Math.floor(a.length * 0.99))],
      ];
    });
    const span = Math.max(...bounds.map(([lo, hi]) => hi - lo));
    if (!span) throw Error("点云范围无效");

      col = [];
    raw.forEach((p, i) => {
      if (p.some((v, k) => v < bounds[k][0] || v > bounds[k][1])) return;
      p.forEach((v, k) =>
        pos.push(((v - (bounds[k][0] + bounds[k][1]) / 2) / span) * 7),
      );

    });

  }
  project(p, w, h) {

      c = Math.cos(this.yaw),
      s = Math.sin(this.yaw),
      cp = Math.cos(this.pitch),
      sp = Math.sin(this.pitch);

      qy = s * x + c * y,
      rx = qx + this.panX,
      ry = cp * qy - sp * z + this.panY,
      rz = sp * qy + cp * z - this.dist;

      ((rx / (-rz * 0.42 * (w / h))) * 0.5 + 0.5) * w,
      ((-ry / (-rz * 0.42)) * 0.5 + 0.5) * h,
    ];
  }

      h = cv.clientHeight,

      g.useProgram(this.program);
      g.uniform1f(this.loc.uYaw, this.yaw);
      g.uniform1f(this.loc.uPitch, this.pitch);
      g.uniform1f(this.loc.uDist, this.dist);

      g.uniform1f(this.loc.uSize, Math.max(1.5, Math.min(4, cv.width / 420)));

        this.anchors.map((p) => this.project(p, w, h)),
        !this.anchors.length,
      );

    this.alive = false;
    cancelAnimationFrame(this.frame);
    this.abort?.abort();

      for (const b of this.buffers) this.gl.deleteBuffer(b);
      this.gl.deleteProgram(this.program);
    }
  }

              image.src = local;
              await image.decode();

$("#logout").onclick = () => {

function data() {
  return (
    heading(
      "DATA ARCHIVE / 04",
      "原始数据",
      "回到原始材料，查看每一个结果的来处。",
      "",
    ) +
    `<div class="file-filters"><div class="tabs" aria-label="文件类型筛选">${[
      ["all", "全部素材"],
      ["video", "视频"],
      ["image", "图片"],
      ["cloud", "点云"],
      ["document", "文档"],
    ]
      .map(
        ([id, text]) =>
          `<button class="tab ${id === filter ? "active" : ""}" data-filter="${id}">${text}</button>`,
      )
      .join(
        "",
      )}</div><label class="search">${icon("search")}<input id="fileSearch" type="search" placeholder="搜索素材名称…" aria-label="搜索素材名称" value=""></label></div><div class="file-grid" id="fileGrid"></div>`
  );
}
function renderFiles() {
  const hits = files
    .map((f, i) => ({ ...f, i }))
    .filter(
      (f) =>
        (filter === "all" || f.type === filter) &&
        f.name.toLowerCase().includes(query.toLowerCase()),
    );
  $("#fileGrid").innerHTML = hits.length
    ? hits
        .map(
          (f) =>
            `<article class="panel file-card"><div class="file-thumb">${f.thumb ? `<img src="${f.thumb}" alt="${f.name}缩略图" ${f.url.endsWith("usv.png") ? 'style="object-fit:contain;padding:20px"' : ""}>` : icon(f.icon)}<span class="file-type">${f.ext}</span></div><div class="file-detail"><h3>${f.name}</h3><p>${f.source}<br>${f.size}</p><div class="file-actions"><button class="button small" data-preview="${f.i}">${icon("eye")}查看</button><a class="button small" href="${f.url}" download>${icon("download")}下载</a></div></div></article>`,
        )
        .join("")
    : '<div class="empty">没有找到匹配的素材，试试其他名称或分类。</div>';
  $$("[data-preview]").forEach(
    (b) => (b.onclick = () => previewFile(Number(b.dataset.preview))),
  );
}
function dialog(title, content) {
  $("#dialogTitle").textContent = title;
  $("#dialogBody").innerHTML = content;
  $("#previewDialog").showModal();
}
function previewFile(i) {
  const f = files[i];
  if (f.type === "cloud") {
    pendingCloudMode = "raw";
    navigate("model");
    return;
  }
  dialog(
    f.name,
    f.type === "video"
      ? `<video src="${f.url}" controls autoplay muted playsinline></video>`
      : f.type === "image"
        ? `<img src="${f.url}" alt="${f.name}">`
        : `<iframe title="已有报告 PDF" src="${f.url}"></iframe>`,
  );
}
$("#closeDialog").onclick = () => $("#previewDialog").close();
$("#previewDialog").addEventListener("close", () =>
  $("#dialogBody").replaceChildren(),
);
$("#previewDialog").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  if (
    e.clientX < r.left ||
    e.clientX > r.right ||
    e.clientY < r.top ||
    e.clientY > r.bottom
  )
    e.currentTarget.close();
});
