/* Real point cloud retains a neutral slate stage for contrast, light surrounding UI. */
.model-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 22px;
}
.model-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

.viewer-actions {

  border-color: transparent;
  background: transparent;
}
.tab.active {
  background: #e6efff;
  color: var(--blue);
}
.search {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  background: white;
  border-radius: 6px;
}
.search .icon {
  color: #8aa0b8;
}
.search input {
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--text);
  font-size: 14px;
  width: 210px;
}
.file-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}
.file-thumb {
  height: 160px;
  position: relative;
  background: #e9f0f8;
  display: grid;
  place-items: center;
  color: #90a9c9;
  overflow: hidden;
}
.file-thumb > .icon {
  width: 45px;
  height: 45px;
  stroke-width: 1.2;
}
.file-thumb img {
  height: 100%;
  width: 100%;
  object-fit: cover;
}
.file-type {
  position: absolute;
  bottom: 12px;
  right: 12px;
  padding: 3px 7px;
  background: #fffdf3df;
  border-radius: 3px;
  font-size: 10px;
  color: #637b98;
}
.file-detail {
  padding: 20px;
}
.file-detail h3 {
  font-size: 18px;
  margin-bottom: 10px;
}
.file-detail p {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.9;
}
.file-actions {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}
.file-actions .button {
  flex: 1;
}
dialog {
  border: 1px solid var(--line);
  padding: 0;
  border-radius: 10px;
  width: min(980px, 90vw);
  color: var(--text);
  background: #fff;
  max-height: 90vh;
}
dialog::backdrop {
  background: #142c4b8a;
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 20px;
  border-bottom: 1px solid var(--line);
}
#dialogBody {
  padding: 18px;
}
#dialogBody img,
#dialogBody video {
  display: block;
  max-width: 100%;
  max-height: 72vh;
  margin: auto;
}
#dialogBody iframe {
  width: 100%;
  height: 72vh;
  border: 0;
}
#toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translate(-50%, 12px);
  opacity: 0;
  pointer-events: none;
  z-index: 100;
  background: #1d395c;
  color: #fff;
  border-radius: 6px;
  padding: 11px 20px;
  font-size: 14px;
  transition: 0.18s;
  box-shadow: 0 6px 24px #102b5622;
}
#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

:root {
  color-scheme: dark;
  --bg: #101e27;
  --panel: #142731;
  --raised: #1c3540;
  --line: #304b58;
  --text: #eaf2f5;
  --muted: #91a8b6;
  --blue: #64ddbf;
  --amber: #64ddbf;
  --teal: #64ddbf;
  --red: #ff9c51;
}
body {
  background: var(--bg);
  color: var(--text);
}
button {
  background: var(--panel);
  color: var(--text);
}
button:hover,
.button:hover {
  background: #203b46;
  border-color: #547b88;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
canvas:focus-visible {
  outline-color: #64ddbf;
}
.site-header {
  background: #10202a;
  border-color: var(--line);
  height: 70px;
  padding: 0 26px;
  gap: 26px;
}
.brand {
  font-size: 26px;
}
.brand small {
  font-size: 9px;
  letter-spacing: 1.8px;
}
.brand > svg {
  stroke: var(--blue);
  width: 39px;
  height: 39px;
}
.nav-item {
  color: #d0dce3;
  font-size: 17px;
}
.nav-item.active {
  color: var(--blue);
}
#navigation {
  gap: 35px;
}
.header-actions {
  gap: 18px;
}
.edition {
  color: var(--muted);
  font-size: 12px;
}
.blog-return {
  font-size: 14px;
}
.app {
  margin-left: 86px;
  min-height: calc(100dvh - 70px);
}
.marine-rail {
  position: fixed;
  left: 0;
  top: 70px;
  bottom: 0;
  width: 86px;
  border-right: 1px solid var(--line);
  background: #10212a;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  padding: 17px 7px;
  z-index: 5;
}
#railNav {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
#railNav .nav-item {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 8px;
  padding: 17px 3px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 450;
  line-height: 1.3;
}
#railNav .nav-item .icon {
  display: block;
  width: 26px;
  height: 26px;
  stroke-width: 1.6;
}
#railNav .nav-item.active {
  background: #19483f;
  color: #6ee5c8;
}
#railNav .nav-item.active:after {
  display: none;
}
.rail-caption {
  font: 9px monospace;
  letter-spacing: 1px;
  color: #597481;
  text-align: center;
  margin-top: auto;
  padding-top: 20px;
}
main {
  padding: 28px;
}
.panel {
  background: var(--panel);
  border-color: #385666;
  border-radius: 7px;
}
.panel-head {
  border-color: var(--line);
}
.panel-head h2 {
  color: #edf4f7;
}
.panel-head .icon {
  color: var(--blue);
}
.button {
  background: transparent;
  color: var(--text);
  border-color: #3a5968;
}
.button.primary {
  background: #67dfc2;
  border-color: #67dfc2;
  color: #0e302e;
  font-weight: 650;
}
.button.primary:hover {
  background: #88ebd1;
}
.pill.warning {
  color: #64ddbf;
  background: #20483f;
}
.pill.muted {
  color: #a5bcc9;
  background: #223b47;
}
.pill.danger {
  color: #ffae70;
  background: #503729;
}
.button.report-entry {
  border-color: #62cbb3;
  color: #77e0c8;
}
.page-heading p,
.tip,
.meta {
  color: var(--muted);
}
.eyebrow {
  color: #67c8b3;
}
.page-heading h1 {
  font-weight: 550;
}
.archive-note {
  color: #8fa6b5;
}
.number {
  color: #a4bcca;
  background: #28414c;
}
.number.active,
.active .number {
  color: #15362e;
  background: var(--blue);
}
.defect-select.active {
  background: #1d423d;
  border-color: #35675b;
}
.data-pair {
  border-color: #2b424f;
}
.defect-info p {
  color: #9db3c0;
}
.model-notice {
  color: #8ca4b2;
}
.model-toolbar {
  background: #162b37;
}
.interaction-tabs .active {
  background: #215046;
  border-color: #3c806e;
  color: #77e3c8;
}
.cloud-stage {
  background: radial-gradient(ellipse at center, #2a414e, #0c1c26);
}
.reconstruction-tabs {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

body[data-page="login"] .marine-rail {
  display: none;
}
body[data-page="login"] .app {
  margin-left: 0;
}
/* The B reference: map left, video and findings right, one telemetry dock. */
body[data-page="monitor"] .app {
  margin-left: 86px;
  flex: 1;
  min-height: 0;
}
body[data-page="monitor"] main {
  padding: 0 16px 10px;
  gap: 14px;
  max-width: none;
}
.marine-toolbar {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 17px 6px;
  border-bottom: 1px solid #345461;
  flex-shrink: 0;
}
.task-picker {
  display: flex;
  align-items: center;
  gap: 17px;
  white-space: nowrap;
  font-size: 16px;
}
.task-picker > span {
  color: #d3e0e7;
}
.task-picker select {
  max-width: 340px;
  min-width: 265px;
  background: #1a303c;
  border: 1px solid #678391;
  border-radius: 6px;
  padding: 9px 34px 9px 13px;
  color: #e5eef4;
  font-size: 15px;
  font-weight: 550;
}
.demo-switch {
  color: #79d6bf;
  font-size: 13px;
  gap: 8px;
}
.demo-switch input {
  accent-color: #65d9b9;
}
.mode-switch {
  background: #142934;
  border: 1px solid #54717f;
  padding: 2px;
  border-radius: 6px;
  gap: 2px;
}
.mode-switch button {
  font-size: 15px;
  color: #d8e6ed;
  padding: 6px 14px;
  background: transparent;
}
.mode-switch button[aria-pressed="true"] {
  background: #6edfc3;
  color: #13352d;
  font-weight: 650;
  box-shadow: none;
}
.marine-toolbar #connectionState {
  display: none;
}
.marine-toolbar .button {
  white-space: nowrap;
  font-size: 12px;
}
.marine-workspace {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1.65fr) minmax(0, 1fr);
  gap: 12px;
}
.marine-workspace .route-panel {
  grid-row: 1/3;
  grid-column: 1;
}
.marine-workspace .camera-panel {
  grid-column: 2;
  grid-row: 1;
}
.marine-workspace .events-panel {
  grid-column: 2;
  grid-row: 2;
  min-height: 0;
}
.route-panel .panel-head {
  padding: 13px 16px;
}
.route-panel .panel-head h2 {
  font-size: 18px;
}
.route-host {
  background-color: #1d3541;
  background-image:
    linear-gradient(#54718017 1px, transparent 1px),
    linear-gradient(90deg, #54718017 1px, transparent 1px);
  background-size: 52px 52px;
}
.integration-empty h3 {
  color: #c4d7e0;
  font-size: 21px;
}
.integration-empty p {
  color: #829eaf;
  font-size: 14px;
}
.integration-empty .pill {
  background: #29434f;
  color: #9db8c7;
  border: 1px solid #405f6d;
}
.empty-symbol {
  font-size: 66px;
  color: #527a8d;
}
.map-north {
  position: absolute;
  bottom: 24px;
  left: 25px;
  color: #abc3d0;
  text-align: center;
  font: 14px/1.8 monospace;
}
.route-readout {
  background: #162d38;
  border-color: #38525f;
  color: #91adbc;
  font-size: 11px;
  padding: 12px 15px;
}
.route-readout b {
  color: #d0e1ea;
}
.camera-panel .panel-head {
  padding: 9px 15px;
}
.camera-panel .panel-head h2 {
  font-size: 17px;
  font-weight: 500;
  white-space: nowrap;
}
.camera-actions {
  gap: 5px;
}
.camera-actions .button {
  color: #adc7d6;
  border-color: transparent;
  font-size: 12px;
  padding: 5px 7px;
  min-height: 28px;
}
.camera-actions b {
  font: 15px monospace;
  font-weight: 400;
  color: #dceaf1;
  margin: 0 7px;
  align-self: center;
}
.camera-view {
  background: #081922;
}
.feed-tag {
  background: #0e2737b8;
  font-size: 10px;
  color: #b8d5e0;
  top: 10px;
  left: 10px;
}
.camera-offline {
  background: #102630;
  color: #a4becb;
}
.events-panel .panel-head {
  padding: 13px 20px;
  border-bottom: 0;
}
.events-panel .panel-head h2 {
  font-size: 23px;
  font-weight: 550;
}
.events-panel .meta {
  font-size: 11px;
  color: #7494a5;
}
.event-list {
  padding: 0 20px 10px;
  display: flex;
  flex-direction: column;
  flex: 1;
  overflow: auto;
  min-height: 0;
}
.event-item {
  border: 0;
  border-top: 1px solid #3b5663;
  border-radius: 0;
  background: transparent;
  padding: 10px 3px;
  gap: 15px;
  min-height: 0;
  flex: 1;
  line-height: 1.3;
}
.event-item:last-child {
  border-bottom: 1px solid #3b5663;
}
.event-item:hover,
.event-item.active {
  background: #1d3e43;
}
.event-name {
  display: block;
  min-width: 0;
}
.event-name strong {
  font-size: 17px;
  line-height: 1.3;
  font-weight: 450;
  display: block;
}
.event-name small {
  display: none;
}
.event-item time {
  font-size: 17px;
  color: #cedee7;
}
.event-symbol {
  color: #79a6b1;
  width: 19px;
  flex-shrink: 0;
  text-align: center;
  font-size: 20px;
}
.priority-event .event-symbol,
.priority-event .event-name strong,
.priority-event time {
  color: #ffa05e;
}
.event-arrow {
  color: #c4d8e1;
  font-size: 25px;
  font-weight: 300;
  margin-left: 10px;
}
.marine-telemetry {
  display: flex;
  align-items: center;
  gap: 15px;
  border-top: 1px solid #3d5b68;
  background: #122732;
  padding: 22px 6px 14px;
  flex-shrink: 0;
}
.metric-grid {
  flex: 1;
  min-width: 0;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  padding: 0;
}
.metric {
  padding: 0 14px;
  border-color: #49626e;
}
.metric > span {
  font-size: 13px;
  color: #b3c7d3;
  margin-bottom: 9px;
  line-height: 1.2;
}
.metric strong {
  font-size: 25px;
  font-weight: 550;
  line-height: 1.2;
  letter-spacing: -0.6px;
  color: #f1f6f8;
}
.metric-alarm {
  background: transparent;
}
.metric-alarm span,
.metric-alarm strong {
  color: #ffab6d;
}
.marine-task-status {
  padding-left: 15px;
  border-left: 1px solid #49626e;
  min-width: 140px;
}
.marine-task-status > span {
  font-size: 13px;
  color: #b3c7d3;
}
.marine-task-status strong {
  display: block;
  font-size: 19px;
  font-weight: 500;
  color: #6edfc1;
  margin-top: 8px;
  white-space: nowrap;
}
.marine-telemetry .report-entry {
  padding: 9px 12px;
  font-size: 14px;
  min-height: 38px;
}
.monitor-status {
  font-size: 9px;
  color: #638394;
  gap: 12px;
}
.monitor-status #sourceBadge {
  margin-left: auto;

  display: none;

    padding: 8px 10px;
  }
  .monitor-status {
    font-size: 9px;
  }
  .task-cover .pill {
    color: #8ce6cf;
  }
  .login-intro img {
    display: none;
  }
}

/* Simplified shell: a single left navigation and one shared context entry. */
.site-header {
  height: 64px;
  min-height: 64px;
  padding: 0 24px;
  flex-wrap: nowrap;
}
.header-actions {
  margin-left: auto;
}
.brand {
  font-size: 25px;
}
.demo-info-button {
  color: #96b6b2;
  background: transparent;
  border: 1px solid #35534f;
  border-radius: 5px;
  padding: 7px 12px;
  cursor: pointer;
  font: inherit;
  font-size: 13px;
}
.demo-info-content {
  padding: 12px 24px 24px;
  max-width: 680px;
  font-size: 16px;
  line-height: 1.8;
}
.marine-rail {
  display: flex;
  top: 64px;
  width: 96px;
  padding: 20px 8px;
}
#railNav {
  gap: 12px;
}
#railNav .nav-item {
  font-size: 13px;
  padding: 18px 3px;
}
.app,
body[data-page="monitor"] .app {
  margin-left: 96px;
  min-height: calc(100dvh - 64px);
}
body[data-page="monitor"] .app {
  height: calc(100dvh - 64px);
}
body[data-page="login"] .app {
  margin-left: 0;
}
body[data-page="login"] .marine-rail {
  display: none;
}
.page-heading {
  margin-bottom: 26px;
}
.page-heading h1 {
  font-size: 30px;
}
.task-kind {
  color: #71b6a7;
  font-size: 14px;
  margin-bottom: 12px;
}
.task-card-body {
  padding: 24px;
}
.task-card h3 {
  margin-bottom: 28px;
}
.task-card-actions {
  margin-top: 10px;
}
.task-cover {
  width: 100%;
  height: auto;
  aspect-ratio: 1.85;
}
.login-card h2 {
  margin-bottom: 28px;
}
.login-intro img {
  height: 230px;
  object-fit: contain;
  object-position: left center;
  background: transparent;
}
.login-intro p {
  font-size: 19px;
}
.model-footer span:last-child,
.stage-label,
.reconstruction-tabs > span {
  display: none;
}
.model-footer {
  justify-content: flex-end;
}
.reconstruction-tabs ~ .cloud-stage {
  height: calc(100vh - 325px);
}
.monitor-status #sourceBadge,
.monitor-status #deviceStamp,
.monitor-status #absoluteTime {
  display: none;
}
.monitor-status {
  display: none;
}
.route-readout #mapSync { display: none; }
.route-host {
  position: relative;
  isolation: isolate;
}
#qingdaoMap {
  position: absolute;
  inset: 0;
  z-index: 0;
  background: #aac1c7;
}
.map-heading {
  color: #a2b9c5;
  font-size: 14px;
  margin-left: auto;
}
.map-loading {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 1;
  background: #10212bea;
  color: #edf7f9;
  padding: 14px 18px;
  border-radius: 6px;
  pointer-events: none;
}
.map-loading[hidden] {
  display: none;
}
.vessel-map-marker {
  background: #17635ccc;
  border: 2px solid #c1fff4;
  border-radius: 50%;
  color: white;
  text-align: center;
  line-height: 28px;
  font-size: 22px;
  box-shadow: 0 0 0 8px #14b9aa30;
}
.leaflet-container {
  font-family: inherit;
}
.leaflet-container .leaflet-control-attribution {
  background: #ffffffe8;
  color: #23424d;
  font-size: 10px;
}
.route-host .map-north {
  display: none;
}
.report-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 24px;
  align-items: start;
}
.report-document {
  background: #283740;
  border: 1px solid #36515e;
  border-radius: 8px;
  overflow: hidden;
}
.report-document-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 18px;
  border-bottom: 1px solid #36515e;
}
.report-document-toolbar span {
  color: #9eb4bf;
  font-size: 14px;
}
.report-sheet {
  display: block;
  width: 100%;
  max-width: 800px;
  margin: 22px auto;
  background: white;
  box-shadow: 0 4px 24px #0003;
}
.report-side {
  padding: 22px;
}
.report-side h3 {
  margin: 0 0 18px;
  font-size: 18px;
}
.report-side dl {
  margin: 0;
}
.report-side dl div {
  padding: 12px 0;
  border-bottom: 1px solid #2b424f;
}
.report-side dt {
  color: #90a9b7;
  font-size: 13px;
  margin-bottom: 7px;
}
.report-side dd {
  margin: 0;
  font-size: 16px;
}
.report-page-list {
  display: grid;
  gap: 6px;
}
.report-page-list button {
  text-align: left;
  padding: 13px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  color: #c6d7df;
  cursor: pointer;
  font: inherit;
  font-size: 14px;
}
.report-page-list button.active {
  border-color: #377260;
  background: #1d493e;
  color: #7fe6c7;
}
.report-page-list button span {
  margin-right: 12px;
  color: #79ac9e;
}
.report-actions {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 20px;
}
@media (max-width: 1099px) {
  body[data-page="monitor"] .app {
    height: auto;
  }
  .report-layout {
    grid-template-columns: minmax(0, 1fr);
  }
  .report-layout > aside {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
}
@media (max-width: 700px) {
  .site-header {
    padding: 0 12px;
    gap: 10px;
  }
  .brand {
    font-size: 20px;
  }
  .brand > svg {
    width: 28px;
    height: 28px;
  }
  .header-actions {
    gap: 10px;
  }
  .blog-return {
    font-size: 12px;
  }
  .demo-info-button {
    font-size: 11px;
    padding: 5px 7px;
  }
  .marine-rail {
    width: 64px;
    padding: 16px 4px;
  }
  #railNav .nav-item {
    font-size: 11px;
    padding: 15px 0;
    gap: 8px;
  }
  #railNav .nav-item .icon {
    width: 23px;
    height: 23px;
  }
  .app,
  body[data-page="monitor"] .app {
    margin-left: 64px;
  }
  main {
    padding: 20px 12px;
  }
  .page-heading {
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 22px;
  }
  .page-heading h1 {
    font-size: 24px;
  }
  .task-picker {
    width: 100%;
    flex-wrap: wrap;
  }
  .task-picker select {
    width: 100%;
    max-width: 100%;
    min-width: 0;
  }
  .marine-workspace {
    display: flex;
    flex-direction: column;
    height: auto;
  }
  .marine-workspace .route-panel {
    height: 360px;
    flex: none;
  }
  .camera-panel {
    min-height: 260px;
  }
  .marine-telemetry {
    overflow: visible;
  }
  .report-document-toolbar {
    flex-wrap: wrap;
  }
  .report-layout > aside {
    grid-template-columns: minmax(0, 1fr);
  }
  .report-sheet {
    margin: 0;
  }
  .file-filters {
    gap: 14px;
  }
  .file-filters .tabs {
    flex-wrap: wrap;
  }
  .file-filters .search {
    max-width: 100%;
    min-width: 0;
  }
  .model-toolbar {
    gap: 10px;
    padding: 12px;
  }
  .reconstruction-tabs {
    padding: 12px;
    gap: 6px;
  }
  .reconstruction-tabs .button {
    font-size: 12px;
    padding: 7px 9px;
  }
  .model-help {
    font-size: 10px;
  }
  .model-footer {
    font-size: 12px;
  }
}

/* Show a decoded report page at once instead of partially painted PNG rows. */
.report-page-stage { position:relative; min-height:480px; }
.report-loading { min-height:480px; display:grid; place-items:center; color:var(--muted); font-size:16px; }
.report-loading[hidden], .report-sheet[hidden] { display:none; }
@media(max-width:600px) { .viewer-actions { flex-wrap:wrap; justify-content:flex-end; } #modelQuality { font-size:12px; padding:6px 8px; } }

.model-preview { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:1; pointer-events:none; }
.has-model-preview .cloud-status { inset:auto 12px 50px; min-height:48px; padding:10px 16px; z-index:2; background:#10232de8; border-radius:6px; font-size:14px; text-align:center; }

/* Supplied logo: preserve the PNG and frame its transparent margins in SVG. */
.brand .brand-logo { width:132px; height:60px; stroke:none; flex-shrink:0; }
.rail-logout { margin-top:auto; border:1px solid var(--line); border-radius:6px; padding:10px 2px; color:var(--muted); background:transparent; font:inherit; font-size:12px; cursor:pointer; }
@media(max-width:700px) { .brand .brand-logo { width:110px; height:50px; } .rail-logout { font-size:11px; } }

    <script>
/* Qingdao demonstration route. Only a configured mapUrl is the host-controller page. */
window.createQingdaoMap = function (element, task, enabled) {
  if (!element || !window.L) return null;
  const route = [
    [36.0522, 120.382],
    [36.0514, 120.3856],
    [36.0502, 120.3894],
    [36.048, 120.394],
    [36.0469, 120.3986],
    [36.0457, 120.402],
  ];
  if (task.id === "qd-return") route.reverse();
  const map = L.map(element, {
    scrollWheelZoom: false,
    minZoom: 10,
    maxZoom: 17,
    zoomControl: false,
  }).setView([36.06, 120.391], 13);
  L.control
    .zoom({ position: "topright", zoomInTitle: "放大", zoomOutTitle: "缩小" })
    .addTo(map);
  const tiles = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution:
      '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
  }).addTo(map);
  const hint = document.querySelector("#mapLoading");
  let loaded = false;
  tiles.on("tileload", () => {
    loaded = true;
    if (hint) hint.hidden = true;
  });
  tiles.on("tileerror", () => {
    if (!loaded && hint) {
      hint.hidden = false;
      hint.textContent = "底图加载较慢，请稍候";
    }
  });
  L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);
  const path = L.polyline(route, {
    color: "#347d87",
    weight: 4,
    dashArray: "7 8",
  });
  const completed = L.polyline([route[0]], { color: "#08d5d1", weight: 5 });
  const boat = L.marker(route[0], {
    icon: L.divIcon({
      className: "vessel-map-marker",
      html: "<span>▲</span>",
      iconSize: [32, 32],
      iconAnchor: [16, 16],
    }),
  });
  if (enabled) {
    path.addTo(map);
    completed.addTo(map);
    boat.addTo(map);
  }
  const observer = new ResizeObserver(() => map.invalidateSize());
  observer.observe(element);
  return {
    setTime(fraction) {
      const progress = Math.max(0, Math.min(1, fraction)) * (route.length - 1);
      const i = Math.min(route.length - 2, Math.floor(progress)),
        t = progress - i;
      const point = route[i].map((v, k) => v + (route[i + 1][k] - v) * t);
      if (enabled) {
        boat.setLatLng(point);
        completed.setLatLngs([...route.slice(0, i + 1), point]);
      }
      return point;
    },
    fit() {
      map.fitBounds(L.latLngBounds(route).pad(0.7), { maxZoom: 14 });
    },
    dispose() {
      observer.disconnect();
      map.remove();
    },
  };
};

v></section></div></div>`

function sampleAt(t) {
  let samples = task.telemetry;
  return [...samples].reverse().find((s) => s.time <= t) || samples[0];
}
function renderMetrics(s) {
  const entries = [
    ["电池健康", s ? `${s.health} %` : "—", false],
    ["剩余电量", s ? `${s.battery} %` : "—", s && s.battery < 25],
    ["运行速度", s ? `${s.speed.toFixed(1)} kn` : "—", false],
    ["通信质量", s ? s.communication : "—", s && s.communication === "较弱"],
    [
      "舱内温度",
      s ? `${s.temperature.toFixed(1)} ℃` : "—",
      s && s.temperature >= 45,
    ],
    ["存储剩余", s ? `${s.storage} %` : "—", s && s.storage < 15],
    ["左推进器", s ? `${s.left} rpm` : "—", false],
    ["右推进器", s ? `${s.right} rpm` : "—", false],
  ];
  $("#deviceMetrics").innerHTML = entries
    .map(
      ([label, value, alarm]) =>
        `<div class="metric ${alarm ? "metric-alarm" : ""}"><span>${label}${alarm ? " · 告警" : ""}</span><strong>${value}</strong></div>`,
    )
    .join("");
}
function bindMonitor() {
  $("#taskSelect").onchange = (e) => {
    cleanup();
    cleanup = () => {};
    task = tasks.find((t) => t.id === e.target.value);
    sessionStorage.setItem("shore-task", task.id);
    offline = false;
    render();
  };
  const mission = task;
  const routeView = createQingdaoMap($("#qingdaoMap"), mission, demo);
  if ($("#fitRoute")) $("#fitRoute").onclick = () => routeView?.fit();
  const v = $("#trialVideo");
  let ended = completedTasks.has(mission.id);
  const disconnected = !demo || offline;
  let saved = playback.get(task.id) || 0;
  routeView?.setTime(saved / mission.duration);
  $("#cameraOffline").hidden = !disconnected;
  $("#connectionState").textContent = disconnected ? "离线" : "演示在线";
  $("#connectionState").className =
    "pill " + (disconnected ? "danger" : "warning");
  $("#feedLabel").textContent = demo
    ? mode === "live"
      ? "录像模拟"
      : "历史回放"
    : "真实流未接入";
  $("#startMission").disabled = disconnected;
  $("#toggleReplay").disabled = disconnected;
  $("#restartReplay").disabled = disconnected;
  $("#fullscreenReplay").disabled = disconnected;
  const update = () => {
    if (!v.isConnected || disconnected) return;
    const t = v.currentTime;
    playback.set(task.id, t);
    const s = sampleAt(t);
    const position = routeView?.setTime(t / mission.duration) || [s.lat, s.lon];
    renderMetrics(s);
    $("#replayTime").textContent = clock(t);
    $("#positionValue").textContent =
      `${position[0].toFixed(4)}° N / ${position[1].toFixed(4)}° E`;
    const absolute = new Date(
      new Date(task.start).getTime() + t * 1000,
    ).toLocaleString("zh-CN", { timeZone: "Asia/Shanghai", hour12: false });
    $("#absoluteTime").textContent = absolute + " · 演示时刻";
    $("#deviceStamp").textContent =
      "状态采样 " + clock(s.time) + " / 视频 " + clock(t) + " · 模拟";
    $("#missionStatus").textContent = ended
      ? "任务已完成"
      : v.paused
        ? t > 0
          ? "已暂停"
          : "待演示"
        : "模拟任务进行中";
    $("#toggleReplay").textContent = v.paused ? "播放" : "暂停";
    $("#syncStatus").textContent = ended
      ? "任务已完成 · 可查看巡检报告"
      : "回放同步";
    $$("[data-event]").forEach((b) =>
      b.classList.toggle(
        "active",
        Math.abs(t - task.events[+b.dataset.event].time) < 1,
      ),
    );
  };
  if (!disconnected) {
    v.src = task.video;
    v.addEventListener(
      "loadedmetadata",
      () => {
        if (saved > 0)
          v.currentTime = Math.min(saved, Math.max(0, v.duration - 0.1));
        update();
      },
      { once: true },
    );
    for (const name of ["timeupdate", "seeked", "play", "pause"])
      v.addEventListener(name, update);
    v.addEventListener("ended", () => {
      ended = true;
      completedTasks.add(mission.id);
      update();
      toast("模拟任务已完成，可查看巡检报告");
    });
    update();
  } else {
    renderMetrics(null);
    $("#deviceStamp").textContent = demo
      ? "设备离线 · 数据停止刷新"
      : "真实设备与历史数据尚未接入";
    $("#missionStatus").textContent = demo ? "设备离线" : "未接入真实设备";
    $("#syncStatus").textContent = "离线 · 不刷新模拟数据";
    $("#absoluteTime").textContent = "—";
    v.removeAttribute("poster");
  }
  async function play() {
    if (disconnected) return;
    ended = false;
    completedTasks.delete(mission.id);
    if (v.ended) v.currentTime = 0;
    try {
      await v.play();
    } catch {
      toast("视频暂时无法播放，请检查素材文件");
    }
  }
  $("#toggleReplay").onclick = () => (v.paused ? play() : v.pause());
  $("#restartReplay").onclick = () => {
    saved = 0;
    ended = false;
    completedTasks.delete(mission.id);
    v.currentTime = 0;
    update();
    play();
  };
  $("#startMission").onclick = () => {
    saved = 0;
    ended = false;
    completedTasks.delete(mission.id);
    v.currentTime = 0;
    play();
  };
  $("#fullscreenReplay").onclick = () => {
    if (v.requestFullscreen)
      v.requestFullscreen().catch(() => toast("浏览器暂不支持全屏"));
    else toast("当前浏览器暂不支持全屏");
  };
  $$("[data-event]").forEach((b) => {
    b.disabled = disconnected;
    b.onclick = () => {
      const seek = () => {
        ended = false;
        completedTasks.delete(mission.id);
        v.pause();
        v.currentTime = task.events[+b.dataset.event].time;
        update();
        toast(
          `已定位 ${task.events[+b.dataset.event].id} · ${clock(v.currentTime)}`,
        );
      };
      if (v.readyState >= 1) seek();
      else v.addEventListener("loadedmetadata", seek, { once: true });
    };
  });
  $$("[data-mode]").forEach(
    (b) =>
      (b.onclick = () => {
        mode = b.dataset.mode;
        render();
      }),
  );
  $("#demoToggle").onchange = (e) => {
    demo = e.target.checked;
    offline = false;
    render();
  };
  $("#connectionToggle").onclick = () => {
    offline = !offline;
    render();
  };
  v.addEventListener("error", () => {
    if (!v.isConnected || disconnected) return;
    v.pause();
    $("#cameraOffline").hidden = false;
    $("#cameraOffline").innerHTML =
      "<strong>视频素材暂不可用</strong><span>请检查素材文件后重试</span>";
    $("#syncStatus").textContent = "视频加载失败 · 已停止回放";
    $("#missionStatus").textContent = "素材加载失败";
  });
  cleanup = () => {
    routeView?.dispose();
    v.pause();
    if (!disconnected) playback.set(mission.id, v.currentTime);
    v.removeAttribute("src");
    v.load();
  };
}
function selectDefect(i) {
  selected = i;
  const d = task.events[i];
  $("#defectDetail").innerHTML =
    `<div class="defect-info"><span class="pill ${d.cls}">${d.level}</span><h3>${d.title}</h3><div class="data-pair"><span>标注编号</span><b>${d.id}</b></div><div class="data-pair"><span>视频位置</span><b>${clock(d.time)}</b></div><div class="defect-actions"><button class="button" id="locateVideo">定位视频</button><a class="button primary" href="#report">查看报告</a></div></div>`;
  $$("[data-defect]").forEach((b) => {
    b.classList.toggle("active", +b.dataset.defect === i);
    b.setAttribute("aria-pressed", String(+b.dataset.defect === i));
  });
  $("#locateVideo").onclick = () => {
    playback.set(task.id, d.time);
    mode = "replay";
    demo = true;
    offline = false;
    navigate("monitor");
  };
}
function bindModel() {
  $$("[data-reconstruction]").forEach((button) => {
    button.onclick = () => {
      reconstructionMode = button.dataset.reconstruction;
      pendingCloudMode = null;
      render();
    };
  });
  if ($("#modelQuality")) $("#modelQuality").onclick = () => {
    reconstructionQuality = reconstructionQuality === "quick" ? "full" : "quick";
    render();
  };
  if (reconstructionMode === "legacy") {
    bindLegacyModel();
    return;
  }
  pendingCloudMode = null;
  selectDefect(0);
  $$("[data-defect]").forEach(
    (b) => (b.onclick = () => selectDefect(+b.dataset.defect)),
  );
  const stage = $("#cloudStage"),
    canvas = $("#cloudCanvas");
  const status = stage.querySelector("#cloudStatus");
  let active = true,
    instance = null,
    pan = true;
  const poster = $("#modelPreview");
  let posterTimer;
  if (poster && window.INSPECTION_ASSET_ORIGIN) {
    const fallback = () => { poster.onerror = null; poster.src = "assets/reconstruction/preview.jpg"; };
    poster.onerror = fallback;
    poster.onload = () => clearTimeout(posterTimer);
    if (!poster.complete) posterTimer = setTimeout(fallback, 5000);
  }
  cleanup = () => {
    active = false;
    clearTimeout(posterTimer);
    instance?.dispose();
  };
  $("#resetView").onclick = () => instance?.reset();
  $("#zoomOut").onclick = () => instance?.zoom(1.15);
  $("#zoomIn").onclick = () => instance?.zoom(1 / 1.15);
  $$("[data-interaction]").forEach(
    (button) =>
      (button.onclick = () => {
        pan = button.dataset.interaction === "pan";
        if (instance) instance.panMode = pan;
        $$("[data-interaction]").forEach((b) => {
          b.classList.toggle("active", b === button);
          b.setAttribute("aria-pressed", String(b === button));
        });
      }),
  );
  loadReconstructionModule()
    .then(({ ReconstructionView }) => {
      if (!active) return;
      instance = new ReconstructionView(
        canvas,
        reconstructionMode,
        (positions) => {
          if (!active) return;
          stage.querySelectorAll(".model-marker").forEach((marker, i) => {
            marker.style.left = positions[i][0] + "px";
            marker.style.top = positions[i][1] + "px";
            marker.style.display = positions[i][2] ? "" : "none";
          });
        },
        (text) => {
          if (!active) return;
          status.textContent = text && $("#modelPreview") ? "预览画面 · " + text : text;
          status.hidden = !text;
        },
        (count) => {
          if (active) {
            $("#modelPreview")?.remove();
            stage.classList.remove("has-model-preview");
          }
          if (active)
            $("#pointCount").textContent =
              count.toLocaleString() +
              (reconstructionMode === "gaussian" ? (reconstructionQuality === "quick" ? " 个高斯点 · 轻量预览" : " 个高斯点 · 完整模型") : " 个点");
        },
        reconstructionQuality,
      );
      instance.panMode = pan;
      cloud = instance;
    })
    .catch(() => {
      if (active) {
        status.hidden = false;
        status.textContent = "三维组件加载失败，请刷新页面重试。";
      }
    });
}
function bindLegacyModel() {
  selectDefect(0);
  $$("[data-defect]").forEach(
    (b) => (b.onclick = () => selectDefect(+b.dataset.defect)),
  );
  cloud = new ShoreCloud(
    $("#cloudCanvas"),
    (positions, hide) => {
      $$(".model-marker").forEach((m, i) => {
        if (!positions[i]) return;
        m.style.left = positions[i][0] + "px";
        m.style.top = positions[i][1] + "px";
        m.style.display = hide ? "none" : "";
      });
    },
    (text) => {
      const el = $("#cloudStatus");
      if (el) {
        el.textContent = text;
        el.hidden = !text;
      }
    },
  );
  cloud.sourceUrl =
    pendingCloudMode === "raw" ? "assets/shoreline-sfm-web.ply" : task.cloud;
  pendingCloudMode = null;
  const legacyView = cloud;
  legacyView.setMode("raw").then(() => {
    if (cloud === legacyView && legacyView.alive && legacyView.points.pos.length && $("#pointCount"))
      $("#pointCount").textContent = legacyView.points.pos.length / 3 + " 个点";
  });
  $("#resetView").onclick = () => cloud.reset();
  $("#zoomOut").onclick = () => (cloud.dist = Math.min(18, cloud.dist * 1.15));
  $("#zoomIn").onclick = () => (cloud.dist = Math.max(3.3, cloud.dist / 1.15));
  $$("[data-interaction]").forEach(
    (b) =>
      (b.onclick = () => {
        cloud.panMode = b.dataset.interaction === "pan";
        $$("[data-interaction]").forEach((x) => {
          x.classList.toggle("active", x === b);
          x.setAttribute("aria-pressed", String(x === b));
        });
      }),
  );
}
function bind() {
  if (current === "login")
    $("#loginForm").onsubmit = (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      if (f.get("account") === "demo" && f.get("password") === "123456") {
        sessionStorage.setItem("shore-login", "yes");
        navigate("monitor");
      } else
        $("#loginError").textContent = "账号或密码不正确，请使用下方演示账号。";
    };
  if (current === "monitor") {
    bindMonitor();
  }
  if (current === "model") bindModel();
  if (current === "report") {
    $("#previewReport").onclick = () =>
      dialog(
        "巡检报告",
        `<iframe title="${task.code} 巡检报告" src="${task.report}"></iframe>`,
      );
    let request = 0, active = true;
    cleanup = () => { active = false; request++; };
    const showPage = async (page) => {
      const token = ++request;
      const status = $("#reportLoading"), sheet = $("#reportSheet");
      status.hidden = false;
      status.textContent = "正在载入报告…";
      sheet.hidden = true;
      const local = `assets/reports/r03/${task.id}-page-${page}.webp`;
      try {
        if (!reportImages.has(local)) reportImages.set(local, (async () => {
          const image = new Image();
          if (window.INSPECTION_REPORT_ORIGIN) {
            let timer;
            try {
              image.src = window.INSPECTION_REPORT_ORIGIN + local;
              await Promise.race([image.decode(), new Promise((_, reject) => {
                timer = setTimeout(() => reject(Error("Image timeout")), 5000);
              })]);
            } catch {
              image.src = local;
              await image.decode();
            } finally { clearTimeout(timer); }
          } else {
            image.src = local;
            await image.decode();
          }
          return image;
        })().catch(error => { reportImages.delete(local); throw error; }));
        const image = await reportImages.get(local);
        if (!active || token !== request) return;
        sheet.src = image.src;
        sheet.alt = `巡检报告第${page}页`;
        sheet.hidden = false;
        status.hidden = true;
        $("#reportPageCount").textContent = `第 ${page} 页 / 共 3 页`;
        $$("[data-report-page]").forEach((b) => {
          const selected = b.dataset.reportPage === String(page);
          b.classList.toggle("active", selected);
          b.setAttribute("aria-pressed", String(selected));
        });
      } catch {
        if (active && token === request) status.textContent = "暂时无法载入，请点击目录重试。";
      }
    };
    $$("[data-report-page]").forEach(button => {
      button.onclick = () => showPage(button.dataset.reportPage);
    });
    showPage(1);
  }
  if (current === "data") {
    renderFiles();
    $("#fileSearch").value = query;
    $("#fileSearch").oninput = (e) => {
      query = e.target.value;
      renderFiles();
    };
    $$("[data-filter]").forEach(
      (b) =>
        (b.onclick = () => {
          filter = b.dataset.filter;
          $$("[data-filter]").forEach((x) =>
            x.classList.toggle("active", x === b),
          );
          renderFiles();
        }),
    );
  }
}
function navigate(page) {
  if (location.hash !== `#${page}`) history.pushState(null, "", `#${page}`);
  render();
}
function render() {
  cleanup();
  cleanup = () => {};
  cloud?.dispose();
  cloud = null;
  let requested = location.hash.slice(1);
  current =
    sessionStorage.getItem("shore-login") === "yes"
      ? pages.some((p) => p[0] === requested)
        ? requested
        : "monitor"
      : "login";
  if (!task && current !== "login") {
    task = tasks[0];
    sessionStorage.setItem("shore-task", task.id);
  }
  // Keep the URL and visible page aligned, including login and invalid routes.
  if (location.hash !== `#${current}`)
    history.replaceState(null, "", `#${current}`);
  document.body.dataset.page = current;
  $("#main").innerHTML = {
    login,
    monitor,
    model,
    report,
    data,
  }[current]();
  $("#breadcrumb").textContent =
    current === "login" ? "演示登录" : pages.find((p) => p[0] === current)[1];
  $("#railNav").innerHTML = pages
    .map(
      ([id, label, n]) =>
        `<a class="nav-item ${id === current ? "active" : ""}" href="#${id}" ${id === current ? 'aria-current="page"' : ""}>${icon(id)}<span>${label}</span><span class="nav-num">${n}</span></a>`,
    )
    .join("");
  $$("#railNav a").forEach((link) => {
    link.onclick = (event) => {
      if (
        event.button ||
        event.metaKey ||
        event.ctrlKey ||
        event.shiftKey ||
        event.altKey
      )
        return;
      event.preventDefault();
      navigate(link.hash.slice(1));
    };
  });
  document.title = $("#breadcrumb").textContent + " · 舟行见微";
  bind();
  window.scrollTo({ top: 0, behavior: "instant" });
}
$(".skip-link").onclick = (e) => {
  e.preventDefault();
  $("#main").focus();
};
window.addEventListener("hashchange", render);

$("#logout").onclick = () => {
  sessionStorage.removeItem("shore-login");
  sessionStorage.removeItem("shore-task");
  task = null;
  offline = false;
  demo = true;
  navigate("login");
};

    f.type === "video"
      ? `<video src="${f.url}" controls autoplay muted playsinline></video>`
      : f.type === "image"

        : `<iframe title="已有报告 PDF" src="${f.url}"></iframe>`,
  );
}
$("#closeDialog").onclick = () => $("#previewDialog").close();
$("#previewDialog").addEventListener("close", () =>
  $("#dialogBody").replaceChildren(),
);
$("#previewDialog").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  if (
    e.clientX < r.left ||
    e.clientX > r.right ||
    e.clientY < r.top ||
    e.clientY > r.bottom
  )
    e.currentTarget.close();
});
